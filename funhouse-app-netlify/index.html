<style>html,body{margin:0;height:100%;background:#F5F1E8}</style>
<script>
  /* Ancienne adresse du livret : on retire l'ancien service worker puis on renvoie vers la nouvelle version. */
  (function () {
    var cible = '../' + location.search + location.hash;
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.filter(function (r) { return r.scope.indexOf('/funhouse-app-netlify/') > -1; }).map(function (r) { return r.unregister(); }));
        }).catch(function () {}).then(function () { location.replace(cible); });
        setTimeout(function () { location.replace(cible); }, 400);
        return;
      }
    } catch (e) {}
    location.replace(cible);
  })();
</script>
